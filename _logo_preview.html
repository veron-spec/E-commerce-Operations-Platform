<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cello logo preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f1f5f9; font-family: system-ui, sans-serif; gap: 48px; padding: 60px 20px; }
  .section { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label { font-size: 11px; color: #94a3b8; letter-spacing: 3px; text-transform: uppercase; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 4px 32px rgba(0,0,0,0.06); padding: 48px; display: flex; align-items: center; justify-content: center; }
  .card.dark { background: #0f172a; }
  svg { display: block; }
  .row { display: flex; gap: 48px; align-items: center; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

<div class="section">
  <div class="label">Logo icon — 浅色背景</div>
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
      <defs>
        <linearGradient id="gOuter" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#1E3A5F"/>
        </linearGradient>
        <linearGradient id="gMid" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E3A5F"/>
          <stop offset="100%" stop-color="#2563EB"/>
        </linearGradient>
        <linearGradient id="gInner" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2563EB"/>
          <stop offset="100%" stop-color="#3B82F6"/>
        </linearGradient>
        <linearGradient id="gFrag" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#60A5FA"/>
          <stop offset="100%" stop-color="#3B82F6"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="68" fill="none" stroke="url(#gOuter)" stroke-width="6" stroke-dasharray="390 37" stroke-dashoffset="0" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="52" fill="none" stroke="url(#gMid)" stroke-width="5" stroke-dasharray="307 30" stroke-dashoffset="-85" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="34" fill="none" stroke="url(#gInner)" stroke-width="4" stroke-dasharray="204 20" stroke-dashoffset="-40" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="4" fill="url(#gInner)"/>
      <path d="M 172 46 A 72 72 0 0 1 188 76" fill="none" stroke="url(#gFrag)" stroke-width="5.5" stroke-linecap="round" transform="translate(6, -12) rotate(10, 180, 61)"/>
    </svg>
  </div>
</div>

<div class="section">
  <div class="label">Logo icon — 深色背景</div>
  <div class="card dark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
      <defs>
        <linearGradient id="gd1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>
        <linearGradient id="gd2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E2E8F0"/>
          <stop offset="100%" stop-color="#93C5FD"/>
        </linearGradient>
        <linearGradient id="gd3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#93C5FD"/>
          <stop offset="100%" stop-color="#60A5FA"/>
        </linearGradient>
        <linearGradient id="gd4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#93C5FD"/>
          <stop offset="100%" stop-color="#60A5FA"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="68" fill="none" stroke="url(#gd1)" stroke-width="6" stroke-dasharray="390 37" stroke-dashoffset="0" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="52" fill="none" stroke="url(#gd2)" stroke-width="5" stroke-dasharray="307 30" stroke-dashoffset="-85" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="34" fill="none" stroke="url(#gd3)" stroke-width="4" stroke-dasharray="204 20" stroke-dashoffset="-40" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="4" fill="url(#gd3)"/>
      <path d="M 172 46 A 72 72 0 0 1 188 76" fill="none" stroke="url(#gd4)" stroke-width="5.5" stroke-linecap="round" transform="translate(6, -12) rotate(10, 180, 61)"/>
    </svg>
  </div>
</div>

<div class="section">
  <div class="label">完整标识 (图标 + 字标)</div>
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="500" height="163">
      <defs>
        <linearGradient id="gw1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#1E3A5F"/>
        </linearGradient>
        <linearGradient id="gw2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E3A5F"/>
          <stop offset="100%" stop-color="#2563EB"/>
        </linearGradient>
        <linearGradient id="gw3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2563EB"/>
          <stop offset="100%" stop-color="#3B82F6"/>
        </linearGradient>
        <linearGradient id="gw4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#60A5FA"/>
          <stop offset="100%" stop-color="#3B82F6"/>
        </linearGradient>
      </defs>
      <g transform="translate(12, 12)">
        <circle cx="40" cy="46" r="42" fill="none" stroke="url(#gw1)" stroke-width="5.5" stroke-dasharray="250 20" stroke-dashoffset="0" stroke-linecap="round"/>
        <circle cx="40" cy="46" r="30" fill="none" stroke="url(#gw2)" stroke-width="4.5" stroke-dasharray="180 16" stroke-dashoffset="-50" stroke-linecap="round"/>
        <circle cx="40" cy="46" r="17" fill="none" stroke="url(#gw3)" stroke-width="3.5" stroke-dasharray="100 12" stroke-dashoffset="-20" stroke-linecap="round"/>
        <circle cx="40" cy="46" r="3" fill="url(#gw3)"/>
        <path d="M 82 34 A 46 46 0 0 1 90 48" fill="none" stroke="url(#gw4)" stroke-width="5" stroke-linecap="round" transform="translate(5, -8) rotate(10, 86, 41)"/>
      </g>
      <text x="108" y="108" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="275" fill="#0F172A" letter-spacing="5">cello</text>
    </svg>
  </div>
</div>

</body>
</html>
